name: Run All 3 Trading Bots Realtime

on:
  schedule:
    - cron: '15 2 * * 1-5'
    - cron: '45 2 * * 1-5'
    - cron: '15 3 * * 1-5'
    - cron: '45 3 * * 1-5'
    - cron: '15 4 * * 1-5'
    - cron: '15 6 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '15 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-all-bots:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install vnstock pandas numpy requests pytz

    - name: Run Bot 1 - MSR + VTP
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot1_msr_vtp.py

    - name: Run Bot 2 - 16 Ma Pullback
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot2_pullback_16.py

    - name: Run Bot 3 - 14 Ma Pullback
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot3_pullback_14.py
 
